<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="favBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4D6C6"/>
      <stop offset="100%" stop-color="#EBCBCB"/>
    </radialGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#51342B"/>
      <stop offset="100%" stop-color="#35251F"/>
    </linearGradient>
  </defs>
  
  <!-- Circular badge with subtle dashed border -->
  <circle cx="50" cy="50" r="47" fill="url(#favBg)"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="#795548" stroke-width="1.5" stroke-dasharray="3,2"/>
  
  <!-- Botanical leaves -->
  <path d="M 32 36 C 30 30 36 28 40 31 C 36 33 34 35 32 36 Z" fill="#C8D5C0"/>
  <path d="M 68 36 C 70 30 64 28 60 31 C 64 33 66 35 68 36 Z" fill="#C8D5C0"/>
  
  <!-- Swirling Mist / Steam -->
  <path d="M 45 38 C 42 30 52 24 48 16 C 53 20 46 27 50 33" fill="none" stroke="#795548" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
  <path d="M 54 36 C 57 29 49 22 55 14 C 52 20 59 25 56 32" fill="none" stroke="#C8D5C0" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>

  <!-- Ceramic Coffee Cup Body -->
  <path d="M 32 44 L 68 44 C 67 60 62 68 50 68 C 38 68 33 60 32 44 Z" fill="url(#cupGrad)"/>
  
  <!-- Cup Handle -->
  <path d="M 67 48 C 74 48 74 58 66 60" fill="none" stroke="#35251F" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Cup Rim highlight -->
  <ellipse cx="50" cy="44" rx="18" ry="3.5" fill="#795548"/>
  <ellipse cx="50" cy="43.5" rx="15" ry="2.2" fill="#FFF8F0" opacity="0.4"/>
  
  <!-- Saucer Base -->
  <path d="M 28 72 C 34 76 66 76 72 72 C 67 74 33 74 28 72 Z" fill="#795548"/>
  <line x1="28" y1="72" x2="72" y2="72" stroke="#35251F" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Little tiny coffee heart in cup -->
  <path d="M 50 56 C 48 53 45 53 45 55 C 45 58 50 61 50 61 C 50 61 55 58 55 55 C 55 53 52 53 50 56 Z" fill="#F4D6C6" opacity="0.85"/>
  
  <!-- Tiny brand initial -->
  <text x="50" y="85" text-anchor="middle" font-family="'Playfair Display', serif" font-size="7" font-weight="700" fill="#35251F" letter-spacing="1">M&amp;C</text>
</svg>
